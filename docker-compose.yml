services:
  vite:
    build:
      context: .
      dockerfile: ${DOCKERFILE}
    container_name: ${CONTAINER_NAME}
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - ${PORT}:${PORT}
      - 7001:7001
      - 7002:7002
      - 7003:7003
      - 7005:7005
      - 8001:8001
      - 2017:2017
    stdin_open: true
    tty: true
    networks:
      - geneva-network

  mongo:
    image: mongo:latest
    container_name: geneva-mongo
    volumes:
      - ${MONGO_LOCAL_DIR}:/data/db
    networks:
      - geneva-network

networks:
  geneva-network:
    driver: bridge

volumes:
  mongodb_data:
